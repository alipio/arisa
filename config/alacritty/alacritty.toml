[general]
import = ["~/.config/alacritty/tokyonight_storm.toml"]

[font]
size = 12.0
offset = { x = 0, y = 2 }

[font.normal]
family = "JetBrainsMono Nerd Font"

[font.bold]
family = "JetBrainsMono Nerd Font"
style = "Bold"

[font.italic]
family = "JetBrainsMono Nerd Font"
style = "Italic"

[selection]
save_to_clipboard = true

[terminal]
shell = "/usr/bin/fish"

[[hints.enabled]]
regex = "[0-9a-f]{7,40}"
action = "Copy"
mouse = { enabled = true }

[keyboard]
bindings = [
  { key = "Return", mods = "Control|Shift", action = "SpawnNewInstance" },
  { key = "U", mods = "Alt", mode = "~Alt", action = "ScrollHalfPageUp" },
  { key = "D", mods = "Alt", mode = "~Alt", action = "ScrollHalfPageDown" },
  { key = "K", mods = "Alt", mode = "~Alt", action = "ScrollLineUp" },
  { key = "J", mods = "Alt", mode = "~Alt", action = "ScrollLineDown" }
]
