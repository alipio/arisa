- defaults:
  link:
    force: true
    relink: true
    create: true

- clean: ["~"]

- link:
  ~/.config:
    glob: true
    path: config/**
  ~/.shell:
  ~/.vim:
  ~/.bash_profile:
  ~/.bashrc:
  ~/.gitconfig:
  ~/.inputrc:
  ~/.irbrc:

- create:
  - ~/.config

- shell:
  - description: Running post-install script (if present)
    command: [ -x ./post-install ] && ./post-install
