- defaults:
    link:
      force: true
      relink: true
      create: true

- clean:
    '~':
    ~/.config:
      recursive: true

- link:
    ~/.config:
      glob: true
      path: config/**
    ~/.shell:
    ~/.vim:
    ~/.bash_profile:
    ~/.bashrc:
    ~/.gitconfig:
    ~/.inputrc:
    ~/.irbrc:

- shell:
  - description: Running the post-install script
    command: 'bash ./post-install.sh'
